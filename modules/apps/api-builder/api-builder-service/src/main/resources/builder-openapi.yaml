info:
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: ""
    version: v1.0
openapi: "3.0.1"
paths:
    "/my-blogs/{id}":
        get:
            operationId: getMyBlog
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                MyBlog:
                                    properties:
                                        headline:
                                            type: string
                                        id:
                                            type: integer
                                            value: int64
            tags: ["MyBlog"]
            x-mappings-definition:
                entity: "com.liferay.blogs.model.BlogsEntry"
                mappings:
                    headline: title
                    id: entryId
                primaryKey: entryId
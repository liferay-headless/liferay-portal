##
## Modules
##

modules.includes.required.test.batch.class.names.includes=\
    **/src/testIntegration/**/staging/**/*Test.java

##
## Test Batch
##

#
# Relevant
#

playwright.test.project[playwright-js-tomcat90-mysql57-jdk8][relevant]=message-boards-web

test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant]=\
    (testray.main.component.name ~ "Export/Import") OR \
    (testray.main.component.name ~ "Site Templates") OR \
    (testray.main.component.name ~ "Staging")

test.batch.run.property.query[functional-upgrade*-tomcat*-mysql*-jdk8][relevant]=\
    (testray.component.names == "Message Boards") AND \
    (testray.main.component.name == "Upgrades Content Management")

##
## Testray
##

testray.main.component.name=Message Boards
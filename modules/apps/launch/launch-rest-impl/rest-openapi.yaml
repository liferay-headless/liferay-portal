components:
    schemas:
        LaunchPublishStatus:
            description:
                The status of a Launch's publish.
            properties:
                errorMessage:
                    description:
                        The reason the Launch's latest publish failed. It is empty unless the label is failed.
                    readOnly: true
                    type: string
                label:
                    description:
                        The status's key. It is publishing while a publish runs, scheduled while the Launch waits for its scheduled publish, published once a publish succeeds, failed when the latest publish failed, and in-progress otherwise.
                    readOnly: true
                    type: string
                label_i18n:
                    description:
                        The status's name in the requested language.
                    readOnly: true
                    type: string
            type: object
info:
    description:
        "API for publishing Launches and checking how their publish went. A Launch groups specific versions of assets, such as web content and pages, so that they go live together. Launches and their assets are created and managed in the Launches application, which also shows each Launch's ID. Publishing runs in the background, so a publish request returns as soon as the publish is queued, and the Launch's publish status shows when the publish finishes and whether it worked. The API is available only while the Launches feature is enabled. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.launch.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Launches
    version: v1.0
    x-feature-flag: LPD-72278
openapi: 3.0.1
paths:
    "/launches/{launchId}/publish":
        post:
            description:
                "Publishes the In Progress Launch with the given ID, exactly as publishing it from the Launches application does. The publish runs in the background and makes every asset in the Launch live together, so a failure publishes nothing. The request returns as soon as the publish is queued and does not wait for it to finish. Responds 202 with no body once the publish is queued, 400 when the Launch has no assets, and 404 when no Launch has the given ID. Only an In Progress Launch can be published: a Launch that is Scheduled, already Published, or already being published is rejected with 409, and the response's title says which. To publish a Scheduled Launch now, unschedule it first. To follow the publish, retrieve the Launch's publish status."
            parameters:
                -   in: path
                    description:
                        The ID of the Launch to publish, as shown in the Launches application.
                    name: launchId
                    required: true
                    schema:
                        format: int64
                        type: integer
            responses:
                202:
                    description:
                        The publish was queued and runs in the background. The response has no body.
                400:
                    description:
                        The Launch has no assets, so there is nothing to publish. Add at least one asset to the Launch first.
                404:
                    description:
                        No Launch exists with the given ID.
                409:
                    description:
                        The Launch cannot be published in its current state, because it is Scheduled, already Published, or already being published. The response's title says which.
            tags: ["Launch"]
    "/launches/{launchId}/publish-status":
        get:
            description:
                Retrieves the publish status of the Launch with the given ID. While a publish runs, the status is publishing. Once the publish finishes, the status is published or failed, and a failed publish's error message says why. Responds 404 when no Launch has the given ID.
            operationId: getLaunchPublishStatus
            parameters:
                -   in: path
                    description:
                        The ID of the Launch, as shown in the Launches application.
                    name: launchId
                    required: true
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LaunchPublishStatus"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/LaunchPublishStatus"
                    description:
                        The Launch's publish status.
                404:
                    description:
                        No Launch exists with the given ID.
            tags: ["LaunchPublishStatus"]
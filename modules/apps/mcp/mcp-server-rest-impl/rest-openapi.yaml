components:
    schemas:
        Prerequisite:
            description:
                "Something a tool's path needs before it can be invoked. A path parameter that qualifies the segments after it names another entity, so that entity has to be identified first: creating a category under `/taxonomy-vocabularies/{taxonomyVocabularyId}/taxonomy-categories` needs a vocabulary. When `toolName` and `toolSetName` are present they identify the operation that lists the entity, so it can be resolved without a further search: pass both to `postToolSetToolSetNameToolInvoke` exactly as given. When only `note` is present the parameter accepts a value you may already hold, and the note says what form it takes."
            properties:
                note:
                    description:
                        What the parameter accepts, when it takes more than an identifier. Present only where it changes what you should do, in which case try the note before invoking the operation named in `toolName`.
                    type: string
                parameter:
                    description:
                        The argument that has to be resolved before the tool can be invoked, named exactly as the tool accepts it, for example "taxonomyVocabularyId".
                    type: string
                toolName:
                    description:
                        The operation that lists the entity this parameter identifies. Named to match the argument `postToolSetToolSetNameToolInvoke` takes, so it can be passed straight through. Absent when no single listing operation resolves the parameter.
                    type: string
                toolSetName:
                    description:
                        Tool-set that exposes the operation named in `toolName`.
                    type: string
            required:
                -   parameter
            type: object
        Tool:
            description:
                A tool exposed by a tool-set, including its input schema.
            properties:
                description:
                    description:
                        Human-readable description of what this tool does.
                    type: string
                inputSchema:
                    additionalProperties: true
                    description:
                        JSON Schema describing the arguments accepted by the tool. Build an input map matching this schema and POST it to `invoke` under the same URL to execute the tool.
                    type: object
                name:
                    description:
                        Stable identifier of the tool within its tool-set.
                    type: string
            required:
                -   name
            type: object
        ToolSearchResult:
            description:
                "A tool matching a search query, ranked by relevance. It describes an operation reachable through this server; it is not itself one of this server's tools. Run it by calling `postToolSetToolSetNameToolInvoke` with its `toolSetName` and `name`. Calling `name` as though it were a tool of its own fails, because the only tools this server exposes are the handful listed in its tool list. When `requiredInputSchema` is present it lists the arguments the tool cannot run without, so a tool taking only required arguments can be invoked straight from a search result without calling `getTool` first. Call `getTool` when you need the optional arguments too."
            properties:
                description:
                    description:
                        What the tool does. More than half the catalogue documents nothing, and for those this falls back to the operation's own name rendered as words, so it is always populated but not always informative.
                    type: string
                name:
                    description:
                        "Stable identifier of the operation within its tool-set, such as `postSiteStructuredContent`. Not a callable tool: pass it verbatim as the `toolName` argument of `getToolSetToolSetNameTool` or `postToolSetToolSetNameToolInvoke`, alongside `toolSetName`."
                    type: string
                prerequisites:
                    description:
                        "What the tool's path needs identified before it can be invoked, returned alongside `requiredInputSchema` on the top result. Read it before invoking: each entry either names the operation that resolves the parameter, so no further search is needed, or says what the parameter accepts."
                    items:
                        $ref: "#/components/schemas/Prerequisite"
                    type: array
                requiredInputSchema:
                    additionalProperties: true
                    description:
                        JSON Schema covering only the tool's required arguments, returned when `includeRequiredInputSchema` is true. Enough to invoke the tool in the common case; call `getTool` for the full schema including optional arguments.
                    type: object
                toolSetName:
                    description:
                        Stable identifier of the tool-set that exposes this tool. Pass this verbatim as `toolSetName` to `getTool` and `invokeTool`.
                    type: string
            required:
                -   name
                -   toolSetName
            type: object
        ToolSet:
            description:
                A named collection of tools.
            properties:
                description:
                    description:
                        Curated, one-sentence description of what this tool-set can do, suitable for routing a natural-language request.
                    type: string
                name:
                    description:
                        Stable identifier of the tool-set. Pass this verbatim as `toolSetName` in subsequent calls.
                    type: string
            required:
                -   name
            type: object
        ToolSummary:
            description:
                A summary of a tool exposed by a tool-set.
            properties:
                description:
                    description:
                        Human-readable description of what this tool does.
                    type: string
                name:
                    description:
                        Stable identifier of the tool within its tool-set. Pass this verbatim as `toolName` in subsequent calls.
                    type: string
            required:
                -   name
            type: object
info:
    description:
        "Single entry point for an AI to discover, understand, and invoke any tool exposed by Liferay. When the user asks for something you do not already know how to do in Liferay, start with `getToolSearchPage`: pass what the user wants to do as `search` and it returns the most relevant tools across every tool-set, ranked. Set `includeRequiredInputSchema` and the top match comes back with the arguments it cannot run without, so you can go straight to `postToolSetToolSetNameToolInvoke`; call `getToolSetToolSetNameTool` first only when you need the optional arguments too. Search one action at a time, since it matches a single operation: a request spanning several steps needs one search per step. Do not begin by browsing the catalogue. `getToolSetsPage` and `getToolSetToolSetNameToolSummariesPage` list every tool-set and every operation in one, which costs more than ten times the context of a search and is rarely what you need; reach for them only when search has returned nothing relevant. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.mcp.server.rest.client', and version '1.0.4'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: MCP
    version: v1.0
openapi: 3.0.1
paths:
    "/tool-search":
        get:
            description:
                "Use this first whenever the user asks for something you do not already know how to do in Liferay. Returns the most relevant tools across every tool-set, ranked by relevance. Pass its `toolSetName` and `name` to `getTool` for the full input schema, or set `includeRequiredInputSchema` to invoke the top match directly. A result may also carry `prerequisites`: each entry names the operation that resolves one of the tool's parameters, so invoke that operation rather than searching for it again. This is far cheaper than browsing with `getToolSets` and `getToolSummaries`; reach for those only when search returns nothing relevant. Search one action at a time. It matches a single operation, so a request spanning several steps must be broken into one search per step: for 'create a book store using objects', search 'create a custom object definition', then 'add a field to a custom object', then 'publish an object definition'. Searching the whole request at once matches on incidental words and returns unrelated tools. Phrase each search as verb plus object plus scope, keeping the user's own terms but writing them in English: 'upload a document to a site', 'create a blog entry'. The catalogue is indexed in English alone, so a search in any other language matches nothing at all, whatever language the conversation is being held in -- translate the request and search in English. If nothing relevant comes back, re-phrase and search again rather than raising `limit`."
            operationId: getToolSearchPage
            parameters:
                -   in: query
                    description:
                        When true, each result carries `requiredInputSchema`, the tool's required arguments only. Use it to skip the `getTool` round trip when you expect to invoke the top match.
                    name: includeRequiredInputSchema
                    required: false
                    schema:
                        type: boolean
                -   in: query
                    description:
                        Maximum number of tools to return. Defaults to 10, which is enough for almost every search. When a result set holds nothing plausible, the cause is usually the wording rather than the depth — search again in plainer words, as in `list cart items` rather than `what is in the shopper's cart`, instead of asking for more results.
                    name: limit
                    required: false
                    schema:
                        type: integer
                -   in: query
                    description:
                        A natural-language description, in English, of what the user wants to do, for example "upload a document to a site" or "create a blog entry". Matched against every tool's name and description, which are indexed in English only.
                    name: search
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ToolSearchResult"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ToolSearchResult"
                                type: array
                    description:
                        The tools most relevant to the search query, ranked by relevance.
            tags: ["ToolSearchResult"]
    "/tool-sets":
        get:
            description:
                Use this only when `getToolSearchPage` has returned nothing relevant for the user's request. Searching is the first thing to try; this is the fallback for when it comes up empty. Returns every tool-set exposed by Liferay, each with a curated description. Pick the tool-set whose description matches the user's intent and pass its `name` to `getToolSetToolSetNameToolSummariesPage` to see what tools it offers.
            operationId: getToolSetsPage
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ToolSet"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ToolSet"
                                type: array
                    description:
                        The available tool-sets.
            tags: ["ToolSet"]
    "/tool-sets/{toolSetName}/tool-summaries":
        get:
            description:
                Use this only as part of the browse fallback, once `getToolSearchPage` has come up empty and you have identified a tool-set with `getToolSetsPage`. Returns every tool in the tool-set, each with a `name` and a description, which for a large tool-set is a great deal of context. Pick the tool whose description matches the user's intent and pass its `name` to `getToolSetToolSetNameTool` to see its input schema.
            operationId: getToolSetToolSetNameToolSummariesPage
            parameters:
                -   in: path
                    description:
                        The tool-set name returned by `getToolSetsPage`.
                    name: toolSetName
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ToolSummary"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ToolSummary"
                                type: array
                    description:
                        The tools exposed by the tool-set.
            tags: ["ToolSummary"]
    "/tool-sets/{toolSetName}/tools/{toolName}":
        get:
            description:
                Use this when you have identified a tool — from a `getToolSearchPage` result or from `getToolSetToolSetNameToolSummariesPage` — and need its full input schema before invoking it. Skip it when the search result already carries a `requiredInputSchema` covering the arguments you need. Returns the tool's `inputSchema`. Build an input map matching `inputSchema` and POST it to `invoke` under the same URL to execute the tool.
            operationId: getToolSetToolSetNameTool
            parameters:
                -   in: path
                    description:
                        The `toolSetName` from a `getToolSearchPage` result, or from `getToolSetsPage`.
                    name: toolSetName
                    required: true
                    schema:
                        type: string
                -   in: path
                    description:
                        The `name` from a `getToolSearchPage` result, or from `getToolSetToolSetNameToolSummariesPage`.
                    name: toolName
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "When true, `inputSchema` is projected to what the tool declares it cannot run without, at every level: the arguments themselves and, within each one, its own required properties -- which is where nearly all of the saving is. Worth asking for when you intend to invoke rather than survey, but the saving varies with how well the operation is documented: across a sample of sixty create operations it trimmed 15% of them substantially, left 35% unchanged because they declare nothing as required, and averaged 1.5× overall. Where an operation under-declares, the trimmed schema can be missing an argument the API will still insist on, so treat a rejection as a reason to fetch the full schema rather than to retry."
                    name: requiredInputSchemaOnly
                    required: false
                    schema:
                        type: boolean
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tool"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Tool"
                    description:
                        The tool with its input schema.
            tags: ["Tool"]
    "/tool-sets/{toolSetName}/tools/{toolName}/invoke":
        post:
            description:
                "Invokes a tool. Never build the request `body` from guesswork — it must match a schema you have actually seen, or the call fails on malformed input. Either schema will do. The `requiredInputSchema` on a `getToolSearchPage` result is enough whenever the required arguments cover what you need; fetch the full `inputSchema` with `getToolSetToolSetNameTool` when you also need optional arguments. A scope parameter accepts a name as well as an identifier — `siteId` takes the site's key, such as `Guest` — so resolving a site to its numeric ID beforehand is usually a wasted round trip. Keys are case-sensitive. Returns the tool's response body unchanged, which for a listing is large: Liferay entities carry their available languages, their permitted actions and every unset field. When you need only some of it, pass a `fields` query parameter naming what you want, as in `fields=id,name` — that turns a ten-row site listing from 6,400 bytes into 700, and a blog posting listing from 20,900 into 1,600."
            operationId: postToolSetToolSetNameToolInvoke
            parameters:
                -   in: path
                    description:
                        The `toolSetName` from a `getToolSearchPage` result, or from `getToolSetsPage`.
                    name: toolSetName
                    required: true
                    schema:
                        type: string
                -   in: path
                    description:
                        The `name` from a `getToolSearchPage` result, or from `getToolSetToolSetNameToolSummariesPage`.
                    name: toolName
                    required: true
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            description:
                                Input map matching the tool's `inputSchema`.
                            type: object
                    application/xml:
                        schema:
                            description:
                                Input map matching the tool's `inputSchema`.
                            type: object
                description:
                    "The complete input map for the target tool, matching the `inputSchema` that `getToolSetToolSetNameTool` returns for this `toolName`. Use that schema's properties exactly as named: when the `inputSchema` declares a `body` property, it holds the request payload and must stay nested under `body` here rather than be flattened into this map; pass any path or query parameters as siblings of `body`. For example, a tool whose `inputSchema` has `body` and `itemId` properties is invoked with `{\"body\": {...}, \"itemId\": \"123\"}`."
                required: false
            responses:
                200:
                    content:
                        text/plain:
                            schema:
                                type: string
                    description:
                        The tool's response body.
            tags: ["Tool"]
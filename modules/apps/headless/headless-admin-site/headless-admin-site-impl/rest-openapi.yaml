components:
    schemas:
        WidgetPageWidgetInstance:
            description:
                A widget instance in a widget page.
            properties:
                externalReferenceCode:
                    description:
                        The external reference code of the widget instance.
                    type: string
                wordSpacing:
                    enum: [-1em, -0.95em, 0.9em, 0.95em, 1.2em, 12em]
                    type: string
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.headless.admin.site.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Admin Sites Headless API
    version: v1.0
openapi: 3.0.1
paths:
    "/sites/{siteExternalReferenceCode}/widget-instances/{widgetInstanceExternalReferenceCode}":
        get:
            # @review
            description:
                Retrieves a widget instance of a widget page or widget page template within a site.
            parameters:
                - in: path
                  name: siteExternalReferenceCode
                  required: true
                  schema:
                      type: string
                - in: path
                  name: widgetInstanceExternalReferenceCode
                  required: true
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/WidgetPageWidgetInstance"
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/WidgetPageWidgetInstance"
            tags: ["WidgetInstance"]